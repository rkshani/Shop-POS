name: JVM and Android build verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run shared JVM tests
        run: gradle :shared:jvmTest --stacktrace
      - name: Compile desktop
        run: gradle :desktopApp:compileKotlinJvm --stacktrace
      - name: Assemble Android debug
        run: gradle :androidApp:assembleDebug --stacktrace
